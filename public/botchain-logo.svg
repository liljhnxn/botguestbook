<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none" width="160" height="40">
  <defs>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Hexagon Bot Logo Icon -->
  <g transform="translate(4, 4)">
    <polygon points="16,1 30,9 30,23 16,31 2,23 2,9" fill="#090d16" stroke="url(#botGrad)" stroke-width="2" />
    <!-- Inner circuitry / AI core -->
    <circle cx="16" cy="16" r="4" fill="url(#botGrad)" />
    <line x1="16" y1="5" x2="16" y2="12" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" />
    <line x1="16" y1="20" x2="16" y2="27" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" />
    <line x1="6.5" y1="10.5" x2="12.5" y2="14" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" />
    <line x1="19.5" y1="18" x2="25.5" y2="21.5" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="16" cy="5" r="1.5" fill="#22d3ee" />
    <circle cx="25.5" cy="21.5" r="1.5" fill="#a855f7" />
    <circle cx="6.5" cy="10.5" r="1.5" fill="#06b6d4" />
    <circle cx="16" cy="27" r="1.5" fill="#8b5cf6" />
  </g>

  <!-- Brand Typography -->
  <text x="44" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" letter-spacing="0.08em" fill="#ffffff">BOT</text>
  <text x="82" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="0.12em" fill="url(#botGrad)">CHAIN</text>
</svg>
